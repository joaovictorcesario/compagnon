[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compagnon"
version = "0.2.0"
description = "Compagnon virtuel pour enfants autistes - prototype de faisabilite S7 (Polytech Lille)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.4"]

[project.optional-dependencies]
voix = ["piper-tts>=1.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
compagnon = "compagnon.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"compagnon.content" = ["*.json"]
"compagnon.ai" = ["*.txt"]
"compagnon.assets.fonts" = ["*.ttf", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: appelle un vrai modele Ollama local (lent, a lancer avec -m llm)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
